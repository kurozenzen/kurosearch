name: Create Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Check if tag exists
        id: check-tag
        run: |
          if git rev-parse "v${{ steps.package-version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.package-version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.package-version.outputs.version }} does not exist"
          fi

      - name: Create Git tag
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.package-version.outputs.version }}" -m "Release v${{ steps.package-version.outputs.version }}"
          git push origin "v${{ steps.package-version.outputs.version }}"

      - name: Generate release notes
        if: steps.check-tag.outputs.exists == 'false'
        id: release-notes
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, generating initial release notes"
            NOTES="Initial release v${{ steps.package-version.outputs.version }}"
          else
            echo "Generating release notes from $PREVIOUS_TAG to HEAD"
            NOTES=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Save to file to handle multiline content
          cat << EOF > release_notes.txt
          $NOTES
          EOF

          # Save notes for Discord embed (escape quotes and newlines for JSON)
          NOTES_ESCAPED=$(echo "$NOTES" | sed 's/"/\\"/g' | awk '{printf "%s\\n", $0}' | sed 's/\\n$//')
          echo "notes=$NOTES_ESCAPED" >> $GITHUB_OUTPUT

          echo "Release notes generated"

      - name: Create GitHub Release
        if: steps.check-tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          name: Release v${{ steps.package-version.outputs.version }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip release creation
        if: steps.check-tag.outputs.exists == 'true'
        run: |
          echo "Release v${{ steps.package-version.outputs.version }} already exists, skipping creation"

      - name: Send Discord notification
        if: steps.check-tag.outputs.exists == 'false'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USERNAME: ${{ secrets.DISCORD_USERNAME }}
          DISCORD_AVATAR: ${{ secrets.DISCORD_AVATAR }}
          DISCORD_MENTIONS: ${{ secrets.DISCORD_MENTIONS }}
          DISCORD_EMBEDS: '[{"title":"Release v${{ steps.package-version.outputs.version }}","description":"${{ steps.release-notes.outputs.notes }}","url":"https://github.com/${{ github.repository }}/releases/tag/v${{ steps.package-version.outputs.version }}","color":1289103,"footer":{"text":"${{ github.repository }}"}}]'
        with:
          args: 'New release **v${{ steps.package-version.outputs.version }}** has been published!'
